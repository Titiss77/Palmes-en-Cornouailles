name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-byethost
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📦 Préparation de tous les sites (Composer & Cache)
        run: |
          # Ajoute bien tous tes chemins séparés par des espaces
          for site in palmes-en-cornouaille.fr/htdocs palmes-en-cornouailles.22web.org/htdocs; do
            if [ -d "$site" ]; then
              echo "Préparation de $site..."
              cd $site
              
              if [ -f "composer.json" ]; then
                # Va générer un vendor tout neuf sans les dépendances de dev
                composer install --no-dev --optimize-autoloader
              fi
              
              if [ -d "writable/cache" ]; then
                rm -rf writable/cache/*
              fi
              
              cd - > /dev/null
            fi
          done

      - name: 📂 Déploiement Site 1 (palmes-en-cornouaille.fr)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: palmes-en-cornouaille.fr/htdocs/
          server-dir: palmes-en-cornouaille.fr/htdocs/
          # On change le nom pour éviter le blocage de ByetHost
          state-name: sync-state.txt
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/spark
            **/phpunit.xml.dist
            **/README.md
            **/LICENSE
            **/composer.json
            **/composer.lock
            **/tests/**
            **/user_guide_src/**
            **/vendor/phpunit/**
            **/vendor/fakerphp/**
            **/vendor/symfony/**
            **/vendor/mockery/**
            **/sites_non_lances/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**