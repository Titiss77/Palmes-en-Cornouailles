name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-byethost
  cancel-in-progress: false

env:
  # === NOUVELLE VARIABLE ICI ===
  SITE_NAME: "palmes-en-cornouaille.fr"
  
  EXCLUDES: &ftp_excludes |
    **/.git*
    **/.git*/**
    **/.github/**
    **/.env
    **/spark
    **/phpunit.xml.dist
    **/README.md
    **/LICENSE
    **/composer.json
    **/composer.lock
    **/tests/**
    **/user_guide_src/**
    **/vendor/phpunit/**
    **/vendor/fakerphp/**
    **/vendor/symfony/**
    **/vendor/mockery/**
    **/sites_non_lances/**
    **/writable/cache/**
    **/writable/logs/**
    **/writable/session/**
    **/public/uploads/**
    **/uploads/**

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📦 Préparation du site (Composer & Cache)
        run: |
          # Utilisation de la variable d'environnement
          site="${{ env.SITE_NAME }}/htdocs"
          if [ -d "$site" ]; then
            echo "Préparation de $site..."
            cd "$site"
            
            if [ -f "composer.json" ]; then
              composer install --no-dev --optimize-autoloader --no-progress --no-interaction
            fi
            
            [ -d "writable/cache" ] && rm -f writable/cache/*
            
            cd - > /dev/null
          fi

      - name: 📂 Déploiement Site (${{ env.SITE_NAME }})
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Injection de la variable dans les chemins
          local-dir: ${{ env.SITE_NAME }}/htdocs/
          server-dir: ${{ env.SITE_NAME }}/htdocs/
          state-name: sync-state.txt
          exclude: *ftp_excludes